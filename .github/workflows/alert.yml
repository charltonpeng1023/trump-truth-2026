name: 警示檢查

on:
  schedule:
    # 每 15 分鐘檢查一次。GitHub 的排程常有 10 分鐘上下的延遲，屬正常。
    - cron: "*/15 * * * *"
  workflow_dispatch:

permissions:
  contents: write
  issues: write

concurrency:
  group: alert-watch
  cancel-in-progress: false

jobs:
  watch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: 檢查有沒有提到警示主題的新貼文
        id: check
        run: python alert.py

      - name: 有命中就順便把網頁資料重算一次
        if: steps.check.outputs.count != '0'
        run: python build.py

      - name: 提交變動
        run: |
          git config user.name  "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add seen.json data.json 2>/dev/null || git add seen.json
          if git diff --cached --quiet; then
            echo "沒有變動，不提交。"
          else
            git commit -m "警示檢查 $(TZ=Asia/Taipei date '+%Y-%m-%d %H:%M')"
            git push
          fi

      - name: 開一張 issue 通知
        if: steps.check.outputs.count != '0'
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh issue create \
            --title "${{ steps.check.outputs.title }}" \
            --body-file alert_body.md
